name = "able-family-dental"
compatibility_date = "2025-01-01"
account_id = "6ba8d559dd652da1003752c4674dfa6c"

# Strips ETag/Last-Modified so the Approximated.app proxy can't serve its
# buggy empty-body revalidation responses. See worker/index.js.
main = "worker/index.js"

# NOTE: the able-family-dental.spark0.io/* zone route exists on the zone but is
# deliberately NOT declared here — the shared CI CLOUDFLARE_API_TOKEN is
# account-scoped and a declared route makes `wrangler deploy` call the zone
# routes API, which 401s (code 10000). Manage the route in the CF dashboard
# (or a locally-authed `wrangler triggers deploy`) instead.

[assets]
directory = "./dist"
binding = "ASSETS"
# Required: without this, asset requests bypass the Worker and keep ETags.
run_worker_first = true
not_found_handling = "404-page"

# PR preview deploys (cf-review) — inherits main + assets from top level.
[env.preview]
name = "able-family-dental-preview"
